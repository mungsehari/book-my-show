spring:
  application:
    name: book-my-show
  config:
    # Local runs read secrets from the repo root .env (run from backend/). Docker passes env vars.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookmyshow}
    username: ${DB_USER:bookmyshow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: Asia/Kolkata
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    ttl: 1h
    issuer: book-my-show
  # Comma-separated. These emails become ADMIN when they sign up.
  admin-emails: ${ADMIN_EMAILS:}
  otp:
    ttl: 5m
    max-attempts: 5
    resend-after: 60s
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # Mood search. A blank key turns AI off; keyword search still works.
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${CLAUDE_MODEL:claude-opus-5-5}
  # Test keys only (rzp_test_...). Empty keys turn payments off.
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
